<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a inspection</title>
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LfrKpQrAAAAAMmi51xrVRwb0LBFDBw-eoPPDrLc"></script>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo.ico') }}">
  <style>
    :root {
      --font-sans: 'Helvetica Neue', Arial, sans-serif;
      --font-serif: Georgia, 'Times New Roman', serif;
      /* Brand greens */
      --brand-100: #A7C957; /* light */
      --brand-600: #6A994E; /* primary */
      --brand-800: #386641; /* dark */
      /* App palette derived from brand */
      --color-bg: #f7faf2;          /* soft background wash */
      --color-bg-2: #eff6e6;        /* subtle gradient stop */
      --color-text: #223429;        /* deep green-gray for readability */
      --color-border: #d6e6cc;      /* gentle greenish-gray borders */
      --color-primary: var(--brand-600);
      --color-primary-2: var(--brand-800);
      --color-focus: rgba(106, 153, 78, 0.2); /* subtle focus ring */
      --color-shadow: rgba(56, 102, 65, 0.15); /* gentle green shadow */
    }
    html, body {
      background: linear-gradient(180deg, var(--color-bg) 0%, var(--color-bg-2) 100%);
      color: var(--color-text);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      background-attachment: fixed;
      position: relative;
      font-family: var(--font-sans);
    }
    .font-serif { font-family: var(--font-serif) !important; }
    .terms-serif * { font-family: var(--font-serif) !important; }
    .container {
      background: transparent;
      color: var(--color-text);
    }
    #map { height: 180px; }
    
    /* Form styling for consistency */
    .form-control, select {
      background-color: white;
      color: #333;
      border: 2px solid var(--color-border);
      border-radius: 12px;
      padding: 15px 20px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus, select:focus {
      background-color: white;
      color: #333;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-focus);
      outline: none;
    }
    
    .btn {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-2) 100%);
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(56, 102, 65, 0.3);
      background: linear-gradient(135deg, var(--brand-100) 0%, var(--brand-800) 100%);
      color: white;
    }
    
    /* Card styling for admin pages */
    .admin-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px var(--color-shadow);
      backdrop-filter: blur(10px);
      max-width: 500px;
      margin: 50px auto;
    }

    /* Site-wide background overlay image */
    .site-bg-img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }
    body { position: relative; }
    .container { position: relative; z-index: 1; }
  </style>
</head>
<body>
  {% set bg_opacity = get_setting('background_image_opacity','0.35') %}
  <img class="site-bg-img" src="{{ url_for('background_image') }}" alt="" style="opacity: {{ bg_opacity }}; display:none;" onload="this.style.display='block'" />
  <div class="container mt-5">
    {% block content %}{% endblock %}
  </div>

  <!-- Hidden Google Translate element -->
  <div id="google_translate_element" style="display:none;"></div>

  <!-- Site-wide translate toggle -->
  <div id="translate-toggle" style="position: fixed; right: 16px; bottom: 16px; z-index: 9999; display:flex; gap:8px;">
    <button type="button" onclick="translateTo('mi')" style="background:#065f46; color:#fff; border:none; padding:10px 14px; border-radius:999px; font-weight:600; box-shadow:0 6px 16px rgba(0,0,0,0.15); cursor:pointer;">Te reo Māori</button>
    <button type="button" onclick="translateTo('en')" style="background:#374151; color:#fff; border:none; padding:10px 14px; border-radius:999px; font-weight:600; box-shadow:0 6px 16px rgba(0,0,0,0.15); cursor:pointer;">English</button>
  </div>

  <script>
  function googleTranslateElementInit() {
    if (window.google && window.google.translate) {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,mi',
        autoDisplay: false
      }, 'google_translate_element');
    }
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : null;
  }
  function setCookie(name, value) {
    const expires = new Date(Date.now() + 365*24*60*60*1000).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
    // also set domain cookie variant to help on some hosts
    try {
      const host = location.hostname.replace(/^www\./, '');
      document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; domain=' + host;
    } catch (e) {}
  }
  function translateTo(lang) {
    const pair = '/en/' + lang;
    setCookie('googtrans', pair);
    // If Google widget is loaded, trigger change programmatically; else reload.
    var combo = document.querySelector('.goog-te-combo');
    if (combo) {
      combo.value = lang;
      combo.dispatchEvent(new Event('change'));
    } else {
      location.reload();
    }
  }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
