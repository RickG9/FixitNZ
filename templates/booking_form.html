<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    {% extends "base.html" %}
{% block content %}
<form method="post" action="/">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" name="name" required>
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" name="email" required>
  </div>
  <div class="mb-3">
    <label for="phone" class="form-label">Phone</label>
    <input type="text" class="form-control" id="phone" name="phone">
  </div>
  <div class="mb-3">
    <label for="device" class="form-label">Device</label>
    <input type="text" class="form-control" id="device" name="device" required>
  </div>
  <div class="mb-3">
    <label for="issue" class="form-label">Issue Description</label>
    <textarea class="form-control" id="issue" name="issue" rows="3"></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Book Inspection</button>
</form>
{% endblock %}
</body>
</html>
