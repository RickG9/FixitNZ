<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
</head>
<body>
    {% extends "base.html" %}
{% block content %}
<form method="post" action="/">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" name="name" required>
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" name="email" required>
  </div>
  <div class="mb-3">
    <label for="phone" class="form-label">Phone (Optional)</label>
    <input type="text" class="form-control" id="phone" name="phone">
  </div>
  <div class="mb-3">
    <label for="device" class="form-label">Device</label>
      <label for="cars">Device Brand/Type:</label>
  <select name="device" id="device">
    <option value="iphone">iPhone</option>
    <option value="ipad">iPad</option>
    <option value="mcb">MacBook</option>
    <option value="win">Windows</option>
    <option value="other">Diagnostic</option>
  </select>
  <label for="cars">Repair:</label>
  <select name="repair" id="repair">
    <option value="scren">Screen</option>
    <option value="batry">Battery</option>
    <option value="chargingport">Charging Port</option>
    <option value="cam">Camera</option>
    <option value="otherrepair">Other Damage</option>
  </select>
  </div>
  <div class="mb-3">
    <label for="issue" class="form-label">Issue Description</label>
    <textarea class="form-control" id="issue" name="issue" rows="6"></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Book Inspection</button>
</form>
{% endblock %}
</body>
</html>
