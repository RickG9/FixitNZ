<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <!-- Favicon for the browser tab -->
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo.ico') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    :root {
      --brand-100: #A7C957; /* light */
      --brand-600: #6A994E; /* primary */
      --brand-800: #386641; /* dark */
      --color-focus: rgba(106, 153, 78, 0.18);
    }
    html, body {
      background: linear-gradient(135deg, var(--brand-100) 0%, var(--brand-600) 100%);
      color: #212529;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      /* Prevent overscroll white background */
      overscroll-behavior: none;
      /* Ensure gradient covers full viewport */
      background-attachment: fixed;
    }
    .container {
      background: transparent;
      color: #212529;
    }
    
    /* Admin card styling */
    .admin-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(56, 102, 65, 0.15);
      backdrop-filter: blur(10px);
      max-width: 500px;
      margin: 50px auto;
    }
    
    .admin-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .admin-title {
      font-size: 2rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    
    /* Form styling for consistency */
    .form-control, select {
      background-color: white;
      color: #333;
  border: 2px solid #d6e6cc;
      border-radius: 12px;
      padding: 15px 20px;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }
    
    .form-control:focus, select:focus {
      background-color: white;
      color: #333;
      border-color: var(--brand-600);
      box-shadow: 0 0 0 3px var(--color-focus);
      outline: none;
      transform: translateY(-2px);
    }
    
    .form-label {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      display: block;
    }
    
    .btn {
      background: linear-gradient(135deg, var(--brand-600) 0%, var(--brand-800) 100%);
      border: none;
      color: white;
      padding: 15px 30px;
      border-radius: 25px;
      transition: all 0.3s ease;
      font-weight: 600;
      width: 100%;
      margin-top: 10px;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(56, 102, 65, 0.25);
      background: linear-gradient(135deg, var(--brand-100) 0%, var(--brand-800) 100%);
      color: white;
    }
    
    .btn-success {
      background: linear-gradient(135deg, var(--brand-600) 0%, var(--brand-800) 100%);
      margin-right: 10px;
      width: auto;
      display: inline-block;
    }
    
    .btn-success:hover {
      background: linear-gradient(135deg, var(--brand-100) 0%, var(--brand-800) 100%);
      color: white;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      width: auto;
      display: inline-block;
    }
    
    .btn-danger:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: white;
    }
    
    .alert {
      border-radius: 12px;
      border: none;
      margin-bottom: 20px;
    }
    
    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      border-left: 4px solid #dc2626;
    }
    
    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      color: #059669;
      border-left: 4px solid #059669;
    }

    /* Site-wide background overlay image */
    .site-bg-img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }
    body { position: relative; }
    .container { position: relative; z-index: 1; }
  </style>
</head>
<body>
  {% set bg_opacity = get_setting('background_image_opacity','0.35') %}
  <img class="site-bg-img" src="{{ url_for('background_image') }}" alt="" style="opacity: {{ bg_opacity }}; display:none;" onload="this.style.display='block'" />
  <div class="container mt-5">
    {% block content %}{% endblock %}
  </div>

  <!-- Hidden Google Translate element -->
  <div id="google_translate_element" style="display:none;"></div>

  <!-- Site-wide translate toggle (admin) -->
  <div id="translate-toggle" style="position: fixed; right: 16px; bottom: 16px; z-index: 9999; display:flex; gap:8px;">
    <button type="button" onclick="translateTo('mi')" style="background:#065f46; color:#fff; border:none; padding:10px 14px; border-radius:999px; font-weight:600; box-shadow:0 6px 16px rgba(0,0,0,0.15); cursor:pointer;">Te reo Māori</button>
    <button type="button" onclick="translateTo('en')" style="background:#374151; color:#fff; border:none; padding:10px 14px; border-radius:999px; font-weight:600; box-shadow:0 6px 16px rgba(0,0,0,0.15); cursor:pointer;">English</button>
  </div>

  <script>
  function googleTranslateElementInit() {
    if (window.google && window.google.translate) {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,mi',
        autoDisplay: false
      }, 'google_translate_element');
    }
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : null;
  }
  function setCookie(name, value) {
    const expires = new Date(Date.now() + 365*24*60*60*1000).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
    try {
      const host = location.hostname.replace(/^www\./, '');
      document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; domain=' + host;
    } catch (e) {}
  }
  function translateTo(lang) {
    const pair = '/en/' + lang;
    setCookie('googtrans', pair);
    var combo = document.querySelector('.goog-te-combo');
    if (combo) {
      combo.value = lang;
      combo.dispatchEvent(new Event('change'));
    } else {
      location.reload();
    }
  }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
